apiVersion: apps/v1
kind: Deployment
metadata:
  name: borsuas-app
  namespace: borsuas

spec:
  replicas: 2

  selector:
    matchLabels:
      app: borsuas

  template:
    metadata:
      labels:
        app: borsuas

    spec:
      containers:
        - name: borsuas
          image: drogueria-borsuas:1.1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: borsuas-secrets

          env:
            - name: NODE_ENV
              value: "production"

            - name: AUTH_TRUST_HOST
              value: "true"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 10
            failureThreshold: 3
