services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: drogueria-borsuas:1.1

    container_name: borsuas-app

    ports:
      - "3001:3000"

    env_file:
      - .env.local

    environment:
      NODE_ENV: production
      AUTH_TRUST_HOST: "true"

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
