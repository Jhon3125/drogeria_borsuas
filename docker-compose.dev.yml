
services:
  borsuas-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: borsuas-dev
    image: drogueria-borsuas:dev

    ports:
      - "127.0.0.1:3003:3000"

    env_file:
      - .env.local

    environment:
      NODE_ENV: development
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3003
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    volumes:
      - .:/app
      - borsuas_dev_modules:/app/node_modules
      - borsuas_dev_next:/app/.next

    stdin_open: true
    tty: true

volumes:
  borsuas_dev_modules:
  borsuas_dev_next:
